[package]
name = "aeron-tools-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aeron_tools_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aeron-protocols = { path = "../../core/protocols" }
aeron-platform = { path = "../../core/engine" }
aeron-daemon = { path = "../../core/daemon" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPanel", "NSWindow", "NSResponder"] }
