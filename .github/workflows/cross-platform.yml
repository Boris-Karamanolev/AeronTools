name: Build & Release (macOS, Windows, Linux / SteamOS)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "AeronTools/**"
      - "AeronTools.xcodeproj/**"
      - "cross-platform/**"
      - ".github/workflows/cross-platform.yml"
  workflow_dispatch:

jobs:
  build-cross-platform:
    name: Build (${{ matrix.target_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_label: linux-steamos
          - os: windows-latest
            target_label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri & HID system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "cross-platform -> target"

      - name: Run protocol, platform & FFI unit tests
        working-directory: cross-platform
        run: cargo test --workspace

      - name: Build headless daemon (aeron-daemon)
        working-directory: cross-platform
        run: cargo build --release -p aeron-daemon

      - name: Install frontend dependencies & typecheck
        working-directory: cross-platform
        run: |
          npm install
          npm run build

      - name: Build Tauri desktop bundle
        working-directory: cross-platform
        run: npx tauri build

      - name: Stage Linux / SteamOS release assets
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p release-assets/steamos-bundle
          cp cross-platform/target/release/bundle/appimage/*.AppImage release-assets/
          cp cross-platform/target/release/bundle/deb/*.deb release-assets/
          cp cross-platform/target/release/aeron-daemon release-assets/steamos-bundle/
          cp -R cross-platform/steamos release-assets/steamos-bundle/
          cp -R cross-platform/decky-plugin release-assets/steamos-bundle/
          tar -czf release-assets/Aeron-Tools-SteamOS-Daemon-Decky.tar.gz -C release-assets/steamos-bundle .
          rm -rf release-assets/steamos-bundle

      - name: Upload Linux / SteamOS artifacts
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: aeron-tools-linux-steamos
          path: release-assets/*

      - name: Stage Windows release assets
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item cross-platform/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item cross-platform/target/release/bundle/msi/*.msi release-assets/
          Compress-Archive -Path cross-platform/target/release/aeron-daemon.exe -DestinationPath release-assets/Aeron-Tools-Windows-Daemon.zip

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aeron-tools-windows
          path: release-assets/*

  build-macos-swift:
    name: Build (macOS Swift + Shared Rust Core)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest installed Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: ${LATEST_XCODE}"
          sudo xcode-select -s "${LATEST_XCODE}/Contents/Developer"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "cross-platform -> target"

      - name: Run Rust workspace unit tests (including macOS backend & aeron-ffi)
        working-directory: cross-platform
        run: cargo test --workspace

      - name: Build universal Rust UniFFI library & Swift bindings
        run: ./cross-platform/scripts/build-macos-xcframework.sh --universal

      - name: Build native Swift macOS app (Universal)
        run: |
          xcodebuild \
            -project AeronTools.xcodeproj \
            -scheme AeronTools \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package macOS app (.zip and .dmg)
        run: |
          mkdir -p release-assets dmg-stage
          APP_PATH="build/DerivedData/Build/Products/Release/Aeron Tools.app"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "release-assets/Aeron-Tools-macOS.zip"
          cp -R "${APP_PATH}" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create \
            -volname "Aeron Tools" \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "release-assets/Aeron-Tools-macOS.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aeron-tools-macos
          path: release-assets/*

  release:
    name: Publish GitHub Release
    needs: [build-cross-platform, build-macos-swift]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh all-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: all-assets/*
