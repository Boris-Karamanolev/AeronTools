name: Build & Release (macOS, Windows, Linux / SteamOS)

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "platforms/**"
      - "core/**"
      - "ui/**"
      - "AeronTools.xcodeproj/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cross-platform.yml"
  workflow_dispatch:

jobs:
  build-cross-platform:
    name: Build (${{ matrix.target_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_label: linux-steamos
          - os: windows-latest
            target_label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri & HID system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config \
            file \
            wget \
            libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run protocol, platform & FFI unit tests
        run: cargo test --workspace

      - name: Build headless daemon (aeron-daemon)
        run: cargo build --release -p aeron-daemon

      - name: Install desktop frontend dependencies
        working-directory: ui
        run: npm install

      - name: Build Decky plugin for SteamOS Gaming Mode
        if: matrix.os == 'ubuntu-22.04'
        working-directory: platforms/steamos/decky
        run: |
          npm ci
          npm run build
          test -f dist/index.js

      - name: Build Linux desktop AppImage
        if: matrix.os == 'ubuntu-22.04'
        working-directory: ui
        run: npx tauri build --bundles appimage

      - name: Build Windows portable executable
        if: matrix.os == 'windows-latest'
        working-directory: ui
        run: npx tauri build --no-bundle

      - name: Stage Linux release asset
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage="release-assets/linux"
          mkdir -p "$stage/decky/dist"
          appimages=(target/release/bundle/appimage/*.AppImage ui/src-tauri/target/release/bundle/appimage/*.AppImage)
          if [[ ${#appimages[@]} -eq 0 ]]; then
            echo "AppImage was not produced" >&2
            exit 1
          fi
          if [[ ! -f target/release/aeron-daemon ]]; then
            echo "aeron-daemon was not produced" >&2
            exit 1
          fi
          cp "${appimages[0]}" "$stage/Aeron-Tools.AppImage"
          cp target/release/aeron-daemon "$stage/aeron-daemon"
          cp platforms/steamos/install/install-steamos.sh "$stage/install-steamos.sh"
          cp platforms/steamos/install/aeron-daemon.service "$stage/aeron-daemon.service"
          cp platforms/steamos/install/99-aeron-tools.rules "$stage/99-aeron-tools.rules"
          cp platforms/steamos/install/INSTALL.txt "$stage/INSTALL.txt"
          cp platforms/steamos/decky/main.py platforms/steamos/decky/plugin.json "$stage/decky/"
          cp platforms/steamos/decky/dist/index.js "$stage/decky/dist/index.js"
          chmod +x "$stage/Aeron-Tools.AppImage" "$stage/aeron-daemon" "$stage/install-steamos.sh"
          tar -czf release-assets/Aeron-Tools-Linux.tar.gz -C "$stage" .
          rm -rf "$stage"

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: aeron-tools-linux
          path: release-assets/Aeron-Tools-Linux.tar.gz
          if-no-files-found: error

      - name: Stage Windows portable executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $candidates = @(
            "target/release/aeron-tools-tauri.exe",
            "ui/src-tauri/target/release/aeron-tools-tauri.exe"
          ) | Where-Object { Test-Path $_ }
          $candidates = @($candidates)
          if ($candidates.Count -lt 1) {
            throw "Portable exe was not produced"
          }
          Copy-Item $candidates[0] release-assets/Aeron-Tools-Windows.exe

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aeron-tools-windows
          path: release-assets/Aeron-Tools-Windows.exe
          if-no-files-found: error

  build-macos-swift:
    name: Build (macOS arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Require an Apple Silicon runner
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: ${arch}"
          if [[ "${arch}" != "arm64" ]]; then
            echo "The published Mac app is arm64-only." >&2
            exit 1
          fi

      - name: Select latest installed Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: ${LATEST_XCODE}"
          sudo xcode-select -s "${LATEST_XCODE}/Contents/Developer"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run Rust workspace unit tests (including macOS backend & aeron-ffi)
        run: cargo test --workspace

      - name: Build arm64 Rust UniFFI library & Swift bindings
        run: ./platforms/macos/ffi/build-xcframework.sh

      - name: Build native Swift macOS app (arm64)
        run: |
          xcodebuild \
            -project AeronTools.xcodeproj \
            -scheme AeronTools \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package macOS app (.dmg)
        run: |
          mkdir -p release-assets dmg-stage
          APP_PATH="build/DerivedData/Build/Products/Release/Aeron Tools.app"
          cp -R "${APP_PATH}" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create \
            -volname "Aeron Tools" \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "release-assets/Aeron-Tools-macOS-arm64.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeron-tools-macos
          path: release-assets/Aeron-Tools-macOS-arm64.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-cross-platform, build-macos-swift]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: List release assets
        run: |
          ls -lh all-assets
          test -f all-assets/Aeron-Tools-macOS-arm64.dmg
          test -f all-assets/Aeron-Tools-Linux.tar.gz
          test -f all-assets/Aeron-Tools-Windows.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            all-assets/Aeron-Tools-macOS-arm64.dmg
            all-assets/Aeron-Tools-Linux.tar.gz
            all-assets/Aeron-Tools-Windows.exe
